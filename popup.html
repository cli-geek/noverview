<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>noverview</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f6fa;
      --border: #e1e5ec;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #1a73e8;
      --on-accent: #ffffff;
      --track: #c4c9d4;
      --knob: #ffffff;
      --warn-bg: #fff4d6;
      --warn-border: #f0cf74;
      --warn-text: #6b4b00;
      --pill-off-bg: #e6e8ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1f26;
        --surface: #262a33;
        --border: #363b47;
        --text: #e8eaf0;
        --muted: #9aa1b0;
        --accent: #8ab4f8;
        --on-accent: #10223d;
        --track: #4a505e;
        --knob: #ffffff;
        --warn-bg: #3a3118;
        --warn-border: #6b5a22;
        --warn-text: #f3d889;
        --pill-off-bg: #333845;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      width: 280px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    header svg {
      width: 24px;
      height: 24px;
      color: var(--accent);
      flex: none;
    }
    .name {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    #status {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--accent);
      color: var(--on-accent);
    }
    body.off #status {
      background: var(--pill-off-bg);
      color: var(--muted);
    }

    #access {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--warn-border);
      border-radius: 10px;
      background: var(--warn-bg);
      color: var(--warn-text);
    }
    #access[hidden], #pageLimitNote[hidden] { display: none; }
    #access p {
      margin: 0 0 8px;
      font-size: 12px;
    }
    #access button {
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--on-accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #access button:hover { filter: brightness(1.08); }

    section {
      margin-bottom: 16px;
      transition: opacity 0.15s;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    body.off .gated {
      opacity: 0.45;
      pointer-events: none;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    label.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 12px;
      min-height: 48px;
      cursor: pointer;
    }
    label.row + label.row { border-top: 1px solid var(--border); }
    .text { display: flex; flex-direction: column; }
    .title { font-weight: 500; }
    .sub { font-size: 12px; color: var(--muted); }

    input[type="checkbox"] {
      appearance: none;
      -moz-appearance: none;
      position: relative;
      flex: none;
      width: 36px;
      height: 20px;
      margin: 0;
      border-radius: 999px;
      background: var(--track);
      cursor: pointer;
      transition: background 0.15s;
    }
    input[type="checkbox"]::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--knob);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s;
    }
    input[type="checkbox"]:checked { background: var(--accent); }
    input[type="checkbox"]:checked::after { transform: translateX(16px); }
    input[type="checkbox"]:focus-visible,
    #results button:focus-visible,
    #access button:focus-visible,
    #pageLimitReset:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #results {
      display: flex;
      padding: 2px;
      gap: 2px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    #results button {
      flex: 1;
      padding: 6px 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    #results button:hover:not(:disabled):not([aria-pressed="true"]) {
      background: var(--border);
    }
    #results button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--on-accent);
    }
    #results button:disabled {
      color: var(--muted);
      opacity: 0.6;
      text-decoration: line-through;
      cursor: default;
    }
    .caption {
      margin: 8px 0 0;
      font-size: 12px;
      color: var(--muted);
    }
    #pageLimitNote {
      margin: 8px 0 0;
      padding: 8px;
      border: 1px solid var(--warn-border);
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn-text);
      font-size: 12px;
    }
    #pageLimitNote a { color: inherit; font-weight: 600; }

    footer {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M5.6 5.6l12.8 12.8"></path>
    </svg>
    <span class="name">noverview</span>
    <span id="status">On</span>
  </header>

  <div id="access" hidden>
    <p>Needs access to Google Search to run on every search.</p>
    <button id="grant">Allow access</button>
  </div>

  <section>
    <h2>AI</h2>
    <div class="card">
      <label class="row">
        <span class="text">
          <span class="title">Hide AI</span>
          <span class="sub">AI Overviews &amp; People also ask</span>
        </span>
        <input type="checkbox" id="toggle">
      </label>
    </div>
  </section>

  <section class="gated">
    <h2>Results</h2>
    <div class="card">
      <label class="row">
        <span class="text">
          <span class="title">Links only</span>
          <span class="sub">Hide videos, images, related searches</span>
        </span>
        <input type="checkbox" id="linksNoImages">
      </label>
      <label class="row">
        <span class="text">
          <span class="title">Links + images</span>
          <span class="sub">Keep the Images row</span>
        </span>
        <input type="checkbox" id="linksWithImages">
      </label>
    </div>
  </section>

  <section class="gated">
    <h2>Search results</h2>
    <div id="results"></div>
    <p class="caption">Results per search (approx.)</p>
    <p id="pageLimitNote" hidden>
      <span id="pageLimitText"></span>
      <a href="#" id="pageLimitReset">Reset</a>
    </p>
  </section>

  <footer id="version"></footer>

  <script src="browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
