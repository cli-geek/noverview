<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Overview Purge</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      width: 240px;
    }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    #access p {
      margin: 10px 0 6px;
      font-size: 12px;
    }
    #access button {
      width: 100%;
    }
  </style>
</head>
<body>
  <label>
    PURGE AI
    <input type="checkbox" id="toggle">
  </label>
  <label>
    LINKS ONLY (NO IMAGES)
    <input type="checkbox" id="linksNoImages">
  </label>
  <label>
    LINKS ONLY (WITH IMAGES)
    <input type="checkbox" id="linksWithImages">
  </label>

  <div id="access" hidden>
    <p>Needs access to Google Search to run on every search.</p>
    <button id="grant">Allow access</button>
  </div>

  <script src="browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
