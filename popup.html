<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Overview Purge</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      width: 240px;
    }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    #access p {
      margin: 10px 0 6px;
      font-size: 12px;
    }
    #access button {
      width: 100%;
    }
    #extraPages {
      width: 90px;
      margin: 0 6px;
    }
    #pageTicks {
      display: flex;
      justify-content: space-between;
      width: 90px;
      margin: -2px 24px 6px auto;
      padding: 0 4px;
      font-size: 10px;
      box-sizing: content-box;
    }
    #pageTicks .over {
      color: #aaa;
      text-decoration: line-through;
    }
    #pageLimitNote {
      margin: 0 0 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <label>
    PURGE AI
    <input type="checkbox" id="toggle">
  </label>
  <label>
    LINKS ONLY (NO IMAGES)
    <input type="checkbox" id="linksNoImages">
  </label>
  <label>
    LINKS ONLY (WITH IMAGES)
    <input type="checkbox" id="linksWithImages">
  </label>
  <label>
    COMPACT
    <input type="checkbox" id="compact">
  </label>
  <label>
    MORE PAGES
    <span>
      <input type="range" id="extraPages" min="0" max="4" step="1">
      <output id="extraPagesValue">1</output>
    </span>
  </label>
  <div id="pageTicks"></div>
  <p id="pageLimitNote" hidden>
    <span id="pageLimitText"></span>
    <a href="#" id="pageLimitReset">Reset</a>
  </p>

  <div id="access" hidden>
    <p>Needs access to Google Search to run on every search.</p>
    <button id="grant">Allow access</button>
  </div>

  <script src="browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
