<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Overview Purge</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      width: 240px;
    }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    #access p {
      margin: 10px 0 6px;
      font-size: 12px;
    }
    #access button {
      width: 100%;
    }
    #results {
      display: flex;
      margin: 2px 0 6px;
    }
    #results button {
      flex: 1;
      padding: 3px 0;
      border: 1px solid #888;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    #results button + button {
      border-left: none;
    }
    #results button[aria-pressed="true"] {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    #results button:disabled {
      color: #aaa;
      text-decoration: line-through;
      cursor: default;
    }
    #pageLimitNote {
      margin: 0 0 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <label>
    PURGE AI
    <input type="checkbox" id="toggle">
  </label>
  <label>
    LINKS ONLY (NO IMAGES)
    <input type="checkbox" id="linksNoImages">
  </label>
  <label>
    LINKS ONLY (WITH IMAGES)
    <input type="checkbox" id="linksWithImages">
  </label>
  <div>SEARCH RESULTS</div>
  <div id="results"></div>
  <p id="pageLimitNote" hidden>
    <span id="pageLimitText"></span>
    <a href="#" id="pageLimitReset">Reset</a>
  </p>

  <div id="access" hidden>
    <p>Needs access to Google Search to run on every search.</p>
    <button id="grant">Allow access</button>
  </div>

  <script src="browser-polyfill.js"></script>
  <script src="popup.js"></script>
</body>
</html>
